<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rake</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/og.png" />
    <meta name="description" content="An infinite minimalist zen garden. Share the sand." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header>
      <img class="mark" src="/logo.svg" width="44" height="44" alt="" />
      <div class="ident">
        <p>FT–011</p>
        <h1>Rake</h1>
        <p class="mute">There is no score. Drag to rake. Place a stone. Copy the URL to keep this garden.</p>
      </div>
    </header>
    <div class="tray">
      <canvas id="sand"></canvas>
    </div>
    <nav>
      <button type="button" data-tool="rake" class="on">Rake</button>
      <button type="button" data-tool="stone">Stone</button>
      <button type="button" data-tool="leaf">Leaf</button>
      <button type="button" id="share">Share garden</button>
      <button type="button" id="reset" class="ghost">Ceremonial reset</button>
    </nav>
    <div id="ceremony" hidden>
      <p>The sand forgets. This takes a moment on purpose.</p>
    </div>
    <footer class="webring">
      <a href="https://fun-toys-alpha.vercel.app">a Fun Toy</a>
      ·
      <a href="https://still-here-psi.vercel.app">prev</a>
      <a href="https://cursorling.vercel.app">next</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
